# ============================================================
#  WoW 钓鱼视觉辅助 —— 配置
#  改完直接重启程序生效。时间单位：秒；长度单位：物理像素
#  下面这些默认值是拿真实游戏截图量出来的，不是瞎猜
# ============================================================

[capture]
# 目标显示器序号：0 = 主显示器。多屏时改这里
monitor = 0
# 帧率上限，0 = 不限
fps_limit = 0

[game]
# 抛竿用的钓鱼技能按键（技能绑在哪个键就写哪个，支持 "1" / "F5" / "num1"）
cast_key = "1"
# 每次抛竿前把游戏窗口拉到前台
activate_window = true
# 游戏窗口标题，精确匹配优先、其次包含匹配。
# 中文客户端是「魔兽世界」，国际服是 "World of Warcraft"。
# 不确定就先跑 calibrate.bat cast，它会把你机器上所有匹配的窗口列出来
window_titles = ["Your Window Title"]

[search]
# 鱼漂搜索区域，按屏幕比例的 (左, 上, 右, 下)，0~1
# 只需要框住水面，别把角色/宠物/UI 框进来（它们也有彩色像素，会干扰定位）
# 下边界要给足余量：抛得远时鱼漂会落到画面更下方，切到边界就只露半截、锁不到
region = [0.28, 0.15, 0.72, 0.62]

[detect]
# ---- 鱼漂定位：靠「暖色」，不是靠饱和度 ----
# 这里踩过三个坑，别再走回头路：
#   1. "红色 + 竖直细长" —— 鱼漂其实是横的，红蓝黄混色
#   2. "高饱和就是鱼漂" —— 黄昏时水面 S 中位 81，反比鱼漂(S 71)还高，判据直接反转
#   3. "块状 + 面积接近典型值" —— 水面反光带被闭运算连成 778x203 巨块把鱼漂吞掉，
#      水底石头又方又 255px 评分反而最高
# 真正稳定的是：水面的冷暖色。两种光照下水面 R-B 都 ≤26，鱼漂的橙红羽毛/黄软木塞到 55~74。
warm_delta = 30
# 饱和度下限，滤掉纯灰噪声
warm_sat_min = 35
# 相对阈值：比画面 R-B 中位数高这么多才算暖色。
# 夜晚深水实测：水面 R-B -99、涟漪 -33、鱼漂 -12。取 80 刚好卡在涟漪和鱼漂之间
warm_rel = 80
# 暖色块面积范围。夜晚近距离的鱼漂暖色块能有 1500 多，900 会把整只排除掉
min_area = 30
max_area = 1600
# 长宽比只用来排掉钓鱼竿那种细长条(0.38)。不能收太窄：
# 鱼漂横向时是 2.0，但只露出软木塞时可能只有 0.68
min_aspect = 0.5
max_aspect = 4.5
# 暖色块只是鱼漂的一部分（红羽毛/棕木塞），向外扩这么多像素盖住整只
box_pad = 20
# 是否用「背景差异」把蓝羽毛也框进来。
# 默认 false：蓝羽毛和深色水面差异太小，连通域会连到水面，把框和中心一起带偏，
# 中心一偏就整只丢锁。只依赖红羽毛+棕木塞反而稳。
use_refine = false
# use_refine=true 时才有意义：差异多大才算鱼漂的一部分
diff_threshold = 30
# 跟踪时在上一位置周围多少像素内找（鱼漂基本不动，30~40 即可）
track_radius = 50
# 连续多少帧找不到暖色算真正丢失（约 1.3 秒）
lost_frames = 90

[bite]
# ---- 咬钩判定：鱼漂"存在度"（窗口内暖色像素数）骤降 ----
# 实测 21 次判定数据：
#   真咬钩 ratio 在 0.00~0.14（水花把鱼漂彻底盖住，暖色归零）
#   水面波浪只挡掉一部分羽毛时 ratio 落在 0.24~0.45
# 两者之间有很宽的空档，所以阈值卡 0.20 —— 设 0.45 会把"波浪遮挡"误判成咬钩
sat_drop_ratio = 0.24
# 绝对下降量下限。远处鱼漂总量才 30 多，别卡太高
min_drop = 15
# 需要连续几帧成立（约 45ms）。调大更稳但更慢
confirm_frames = 3
# 基线的滑动窗口帧数（约 0.3 秒）
base_window = 21
# 基线本身低于这个值说明鱼漂早就没了，不再判定
min_base_area = 25
# 锁定后静默这么久才开始判定 —— 刚抛竿水面还在荡漾，那时候的波动不算数
min_wait = 1.0
# 触发后的静默期，防止一口鱼连点好几次
cooldown = 1.5

# ---- 信号 B：鱼漂被咬时会快速向下位移 ----
# 它比"面积归零"更早触发：鱼漂刚开始下沉、暖色还没被水花盖住的那一两帧就能抓到。
# 实测同一条鱼漂：正常水面波动质心下移 95 分位 5.6px、最大 6.1px，
# 真咬钩那一帧直接掉 18.6px，所以阈值 8 很安全。
use_sink = true
# 下沉阈值按「鱼漂自身高度」的比例算，自动适应分辨率（1080p/2K/4K）、
# 相机距离和 UI 缩放。同一个 10px 下沉，在大鱼漂上微不足道，
# 在小鱼漂上已经超过三分之一 —— 写死像素换台机器就废了。
sink_h_ratio = 0.15
# 绝对下限，防止鱼漂特别小时阈值退化成 1~2px
sink_px_min = 6.0
# 兜底值：只有拿不到鱼漂高度时才用
sink_px = 10.0
sink_speed_px = 10.0
# 下沉必须配合「面积掉了一半以上」才算咬钩。
# 实测大鱼漂（面积500~1100）光靠水面起伏就能让质心晃 12~20px，单独用下沉会疯狂误判
sink_ratio = 0.55
# 面积归零时还必须满足这个下沉量才算咬钩。
# 实测"波浪完全遮挡"和"鱼自然跑掉"都会让面积归零，但那两种情况质心几乎不动(-0.4px)，
# 只有真咬钩才明显下沉(+22px)。这一条能干掉大部分空竿。
vanish_dy_min = 3.0

[timing]
# 抛竿后等多久再找鱼漂 —— 鱼漂是淡入的，实测要 2 秒才稳定
cast_settle = 2.2
# 找鱼漂最长耗时，超时就重抛
acquire_timeout = 4.0
# 等咬钩的最长时间，超了重抛
bite_timeout = 30
# 右键扬竿后随机等 2~4 秒再抛下一竿
after_click_min = 2.0
after_click_max = 4.0
# 重抛前的额外间隔
retry_delay = 0.6

[humanize]
enabled = true
# 点击位置随机抖动（鱼漂只有 28x20，抖 2px 就够了，别抖飞）
click_jitter_px = 2
press_hold_ms = 45
# 判定咬钩之后，等这么久再去点鱼漂 —— 模拟真人反应时间
# 实测延迟 2 秒内点都还能钓到，所以 200~500ms 完全安全，不影响成功率
# 想更灵敏就调小（比如 0.05~0.15），想更像人就调大
react_delay_min = 1
react_delay_max = 1.5

[verify]
# ---- 用游戏自带的提示文字，核对这次扬竿到底对不对 ----
# 屏幕上方会出现一行提示（都是黄字）：
#   「你的鱼逃走了！」→ 确实有鱼咬钩，判定**正确**，只是这次没钓上来（钓鱼本身有成功率）
#   「没有鱼上钩」    → 当时根本没鱼咬钩，判定**错误** → 会把现场截图存进 debug/wrong/
#   无文字           → 钓上来了
# 判定错误的现场图命名 wrong-时分秒-cast<竿号>.png，方便和日志对照
enabled = true
# 扬竿后等多久再去截提示。文字要过一会儿才出现，太早截是空的
delay = 1.0
# 提示文字区域（屏幕比例，左上右下）。这行字在画面最上方，**不在搜索区域里**
region = [0.42, 0.07, 0.54, 0.15]
# 黄字像素少于这个数 → 认为没有文字
min_bright = 40
# 字符段数 ≥ 这个 → 判为「鱼逃走了」。实测「你的鱼逃走了！」是 8 段
min_segments = 7

[ui]
# 调试预览窗口：能看到绿框（鱼漂）、黄框（判定窗口）、实时彩色像素数
# 第一次用强烈建议开着，看 ratio 那一行就知道参数合不合适
preview = true
preview_scale = 0.55
show_roi = true
